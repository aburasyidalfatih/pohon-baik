# Database lokal untuk pengembangan: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: pohonbaik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pohonbaik
      POSTGRES_PASSWORD: pohonbaik
      POSTGRES_DB: pohonbaik
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
